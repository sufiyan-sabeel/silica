[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "silica-lang"
version = "0.2.0"
description = "Silica — a small, statically typed, bytecode-compiled programming language with a UI DSL and a web renderer"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Umaiz Sufiyan" }]
keywords = ["language", "compiler", "bytecode", "vm", "interpreter"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Software Development :: Compilers",
]

[project.scripts]
silica = "silica.cli:main"

[project.urls]
Repository = "https://github.com/sufiyan-sabeel/silica.git"
Issues = "https://github.com/sufiyan-sabeel/silica/issues"
Homepage = "https://github.com/sufiyan-sabeel/silica"

[tool.setuptools]
packages = ["silica"]
