[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "silica-lang"
version = "0.10.1"
description = "Silica — a small, statically typed, bytecode-compiled programming language with a UI DSL and a web renderer"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Umaiz Sufiyan" }]
keywords = ["language", "compiler", "bytecode", "vm", "interpreter"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Compilers",
    "Topic :: Software Development :: Interpreters",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pillow>=9", "build>=1", "wheel", "setuptools>=64",
       "numpy>=1.21"]

[project.scripts]
silica = "silica.cli:main"

[project.urls]
Repository = "https://github.com/sufiyan-sabeel/silica.git"
Issues = "https://github.com/sufiyan-sabeel/silica/issues"
Homepage = "https://github.com/sufiyan-sabeel/silica"
Documentation = "https://github.com/sufiyan-sabeel/silica/tree/main/docs"
Changelog = "https://github.com/sufiyan-sabeel/silica/blob/main/CHANGELOG.md"

[tool.setuptools]
packages = ["silica", "silica.gui", "silica.ide", "silica.interop",
            "silica.interop.providers", "silica.tui", "silica.ui",
            "silica.voice", "silica.voice.engines"]

[tool.setuptools.package-data]
"silica.ui" = ["assets/*.png"]
"silica.ide" = ["app.html"]
