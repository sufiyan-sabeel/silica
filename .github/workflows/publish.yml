name: Publish to PyPI

# Trusted publishing: PyPI verifies this workflow through OIDC, so no API token
# is stored in the repository, in a secret, or anywhere else. Configure the
# publisher once at https://pypi.org/manage/account/publishing/ with:
#   owner: sufiyan-sabeel   repository: silica
#   workflow: publish.yml   environment: pypi

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      repository:
        description: "Where to upload"
        required: true
        default: testpypi
        type: choice
        options: [testpypi, pypi]

permissions:
  contents: read

jobs:
  publish-pypi:
    name: Publish the CI-built artefacts to PyPI
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.repository == 'pypi')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v4

      - name: Download the artefacts CI built for this commit
        # The whole point: never rebuild between destinations. These are the same
        # files attached to the GitHub release, so PyPI and GitHub serve identical
        # bytes.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA=$(git rev-parse HEAD)
          echo "shipping commit: $SHA"
          RUN=$(gh run list --workflow=ci.yml --commit="$SHA" --status=success \
                --limit 1 --json databaseId --jq '.[0].databaseId')
          if [ -z "$RUN" ] || [ "$RUN" = "null" ]; then
            echo "no successful CI run for $SHA — refusing to rebuild" >&2
            exit 1
          fi
          echo "downloading dist from CI run $RUN"
          gh run download "$RUN" -n dist -D dist
          ls -l dist/

      - name: Verify the packages (Silica)
        run: |
          python tools/package/facts.py --dist-dir dist --out build/packaging/facts.json
          python -m silica run --allow-fs-read . --allow-fs-write . tools/package/sums.sc
          python -m silica run --allow-fs-read . --allow-fs-write . tools/package/verify.sc

      - name: Upload to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
