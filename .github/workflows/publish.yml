name: Publish to PyPI

# Trusted publishing: PyPI verifies this workflow through OIDC, so no API token
# is stored in the repository, in a secret, or anywhere else. Configure the
# publisher once at https://pypi.org/manage/account/publishing/ with:
#   owner: sufiyan-sabeel   repository: silica
#   workflow: publish.yml   environment: pypi

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      repository:
        description: "Where to upload"
        required: true
        default: testpypi
        type: choice
        options: [testpypi, pypi]

permissions:
  contents: read

jobs:
  build:
    name: Build wheel and sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tooling
        run: python -m pip install --upgrade pip build
      - name: Build
        run: python -m build
      - name: Check the artefacts
        run: |
          python - <<'PY'
          import glob, sys, zipfile, tarfile
          wheel = glob.glob("dist/*.whl")[0]
          sdist = glob.glob("dist/*.tar.gz")[0]
          names = zipfile.ZipFile(wheel).namelist()
          required = ["silica/cli.py", "silica/vm.py", "silica/checker.py",
                      "silica/compiler.py", "silica/interop/worker_main.py",
                      "silica/stdlib_path.py"]
          missing = [r for r in required if r not in names]
          if missing:
              sys.exit("wheel is missing: %s" % ", ".join(missing))
          leaks = [n for n in names if n.startswith(("tests/", "examples/", "docs/"))]
          if leaks:
              sys.exit("wheel carries source-only files: %s" % leaks[:3])
          members = tarfile.open(sdist).getnames()
          if not any(m.endswith("examples/stdlib_tour.sc") for m in members):
              sys.exit("sdist is missing the examples")
          print("wheel: %d files, sdist: %d files — both complete" % (len(names), len(members)))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-testpypi:
    name: Upload to TestPyPI
    if: github.event_name == 'workflow_dispatch' && inputs.repository == 'testpypi'
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    name: Upload to PyPI
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.repository == 'pypi')
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
