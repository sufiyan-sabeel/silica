name: CI

# This workflow runs exactly the checks the README documents locally:
#   python3 -m unittest discover -s tests -t .   (407 tests)
#   python3 -m silica test tests
#   python3 -m silica fmt --check <every .sc file>
on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install .
      - name: Unit tests
        run: python -m unittest discover -s tests -t . -v
      - name: Silica-level tests
        run: python -m silica test tests
      - name: Formatting
        run: |
          python -m silica fmt --check examples/*.sc tests/silica/*.sc benchmarks/silica/*.sc
      - name: Version
        run: python -m silica --version
