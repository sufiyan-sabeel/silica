name: Verify release

# GitHub Packages has no Python registry (it supports npm, RubyGems, Maven,
# Gradle, NuGet and containers), so Silica is distributed as versioned GitHub
# Release assets instead. That makes the assets the real distribution, and this
# workflow checks them the way a stranger would: download from the public URL,
# verify the published checksums, install into a clean environment, run a real
# script. If a release is missing an asset or a checksum is wrong, this fails.
#
# See docs/PACKAGING.md for why the assets are the distribution and not a
# package registry.

on:
  # A release created with GITHUB_TOKEN does not trigger other workflows, so
  # `release: [published]` would never fire for releases published by release.yml.
  # Chaining on the Release workflow completing does fire.
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to verify (e.g. v0.9.1)"
        required: true

permissions:
  contents: read

jobs:
  verify:
    # only after a successful Release run, or on an explicit dispatch
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Resolve the tag
        id: tag
        run: |
          TAG="${{ github.event.inputs.tag || github.event.workflow_run.head_branch }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      # install.sh lives in the repository, so it has to be present before a
      # step that runs it. Without this the installer steps failed with
      # "cannot open ../install.sh".
      - name: Check out the installer
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download the published assets
        run: |
          mkdir -p assets
          cd assets
          gh release download "${{ steps.tag.outputs.tag }}" \
            --repo "$GITHUB_REPOSITORY" --clobber
          ls -l
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Verify the published checksums
        run: |
          cd assets
          sha256sum --check SHA256SUMS.txt

      - name: Install the wheel into a clean environment
        run: |
          python -m venv /tmp/verify
          /tmp/verify/bin/pip install --quiet --no-index --no-deps \
            "assets/silica_lang-${{ steps.tag.outputs.version }}-py3-none-any.whl"
          /tmp/verify/bin/silica --version

      - name: The installed CLI must report the released version
        run: |
          HAVE=$(/tmp/verify/bin/silica --version | awk '{print $2}')
          WANT="${{ steps.tag.outputs.version }}"
          echo "installed=$HAVE tag=$WANT"
          [ "$HAVE" = "$WANT" ] || { echo "installed version does not match the tag"; exit 1; }

      - name: Run a real Silica program from the installed wheel
        run: |
          cd /tmp
          printf 'sfn main() {\n    sprint("verified from the release asset")\n}\n' > check.sc
          /tmp/verify/bin/silica check.sc

      - name: The IDE assets must resolve inside the installed package
        run: |
          /tmp/verify/bin/python - <<'PY'
          import os, silica.ide
          path = os.path.join(os.path.dirname(silica.ide.__file__), "app.html")
          size = os.path.getsize(path)
          assert size > 1000, "app.html is missing or truncated: %s" % path
          print("app.html present:", size, "bytes")
          PY

      # file:// so the installer takes its real download-and-verify path.
      # Passing SILICA_ARTIFACT would skip verification by design, which would
      # make this step prove nothing — that was a real bug in this workflow.
      - name: The installer must verify the published checksums
        run: |
          HOME=/tmp/fresh SILICA_VERSION="${{ steps.tag.outputs.version }}" \
            SILICA_BASE_URL="file://$PWD/assets" sh ./install.sh
          /tmp/fresh/.local/bin/silica --version
          /tmp/fresh/.local/bin/silica --version | grep -q "${{ steps.tag.outputs.version }}"

      - name: The installer must refuse a wheel whose checksum does not match
        run: |
          mkdir -p /tmp/tampered
          cp assets/* /tmp/tampered/
          printf 'tampered' >> "/tmp/tampered/silica_lang-${{ steps.tag.outputs.version }}-py3-none-any.whl"
          if HOME=/tmp/bad SILICA_VERSION="${{ steps.tag.outputs.version }}" \
               SILICA_BASE_URL="file:///tmp/tampered" sh ./install.sh > /tmp/bad.log 2>&1; then
            echo "the installer accepted a wheel whose checksum does not match:"
            cat /tmp/bad.log
            exit 1
          fi
          grep -q "checksum mismatch" /tmp/bad.log || {
            echo "the installer failed, but not because of the checksum:"; cat /tmp/bad.log; exit 1; }
          echo "refused a tampered wheel, as it should"
