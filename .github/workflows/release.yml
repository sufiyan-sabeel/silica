name: Release

# Builds the wheel and sdist for a tag, generates SHA256SUMS.txt and attaches all
# three to the GitHub release. install.sh downloads the checksum file first and
# refuses to install without it, so a release is only usable once every asset is
# present — which is why this job uploads them in one step.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build a release for (e.g. v0.3.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"

      - name: Test before publishing anything
        run: |
          python -m unittest discover -s tests -t .
          python -m silica test tests
          python -m silica fmt --check examples/*.sc tests/silica/*.sc benchmarks/silica/*.sc

      - name: Check the version matches the tag
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          WANT="${TAG#v}"
          HAVE=$(python -c "import silica; print(silica.__version__)")
          SCRIPT=$(sed -n 's/.*SILICA_VERSION:-\([0-9.]*\)}.*/\1/p' install.sh | head -n1)
          echo "tag=$TAG version=$HAVE installer=$SCRIPT"
          [ "$WANT" = "$HAVE" ] || { echo "tag and package version disagree"; exit 1; }
          [ "$WANT" = "$SCRIPT" ] || { echo "tag and install.sh default disagree"; exit 1; }

      - name: Build wheel and sdist
        run: python -m build

      - name: Generate checksums
        run: cd dist && sha256sum *.whl *.tar.gz > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Smoke-test the built wheel in a clean environment
        run: |
          python -m venv /tmp/check
          /tmp/check/bin/pip install --quiet dist/*.whl
          cd /tmp
          /tmp/check/bin/silica --version
          printf 'sfn main() {\n    sprint("ok")\n}\n' > /tmp/ok.sc
          /tmp/check/bin/silica /tmp/ok.sc

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Silica ${{ github.event.inputs.tag || github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS.txt
