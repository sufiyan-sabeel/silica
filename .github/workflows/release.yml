name: Release

# Attaches the artefacts CI already built to the GitHub release.
#
# This workflow does not build. It waits for the CI run of the tagged commit,
# downloads the `dist` artifact, verifies it with the Silica packaging check, smoke
# tests the wheel, and attaches those exact files. The publish workflow downloads
# the same artifact, so GitHub and PyPI serve identical bytes.
#
# It used to run `python -m build` itself, which produced a second, byte-different
# build — the duplicate-asset problem that had to be cleaned up by hand for v0.10.1.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag whose CI build should be released (e.g. v0.10.1)"
        required: true
      dry_run:
        description: "Verify only: download and check the artefacts, publish nothing"
        type: boolean
        default: true

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"

      - name: Check the version matches the tag
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          WANT="${TAG#v}"
          HAVE=$(python -c "import silica; print(silica.__version__)")
          SCRIPT=$(sed -n 's/.*SILICA_VERSION:-\([0-9.]*\)}.*/\1/p' install.sh | head -n1)
          echo "tag=$TAG version=$HAVE installer=$SCRIPT"
          [ "$WANT" = "$HAVE" ] || { echo "tag and package version disagree"; exit 1; }
          [ "$WANT" = "$SCRIPT" ] || { echo "tag and install.sh default disagree"; exit 1; }

      - name: Wait for the CI build of this commit
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          SHA=$(git rev-parse "$TAG^{commit}")
          echo "shipping commit: $SHA"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

          # The tag push starts CI and this workflow at the same time, so the run
          # may not exist yet. Wait for it rather than building anything here.
          RUN=""
          for attempt in $(seq 1 40); do
            RUN=$(gh run list --workflow=ci.yml --commit="$SHA" --limit 1 \
                    --json databaseId --jq '.[0].databaseId // empty')
            if [ -n "$RUN" ]; then break; fi
            echo "attempt $attempt: no CI run for $SHA yet, waiting 15s"
            sleep 15
          done
          if [ -z "$RUN" ]; then
            echo "no CI run appeared for $SHA — refusing to build here" >&2
            exit 1
          fi
          echo "watching CI run $RUN"
          gh run watch "$RUN" --exit-status --interval 10
          echo "run=$RUN" >> "$GITHUB_OUTPUT"

      - name: Download the artefacts CI built
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "${{ steps.ci.outputs.run }}" -n dist -D dist
          ls -l dist/

      - name: Verify the packages (Silica)
        run: |
          python tools/package/facts.py --dist-dir dist --out build/packaging/facts.json
          python -m silica run --allow-fs-read . --allow-fs-write . tools/package/sums.sc
          python -m silica run --allow-fs-read . --allow-fs-write . tools/package/verify.sc

      - name: Smoke-test the downloaded wheel in a clean environment
        run: |
          python -m venv /tmp/check
          /tmp/check/bin/pip install --quiet dist/*.whl
          cd /tmp
          /tmp/check/bin/silica --version
          printf 'sfn main() {\n    sprint("ok")\n}\n' > /tmp/ok.sc
          /tmp/check/bin/silica run /tmp/ok.sc

      - name: Write the release notes from the changelog
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          TAG="$TAG" python - <<'PY' > release-body.md
          import os, pathlib, re
          version = os.environ["TAG"].lstrip("v")
          text = pathlib.Path("CHANGELOG.md").read_text()
          match = re.search(r"^## \[%s\].*?(?=^## \[|\Z)" % re.escape(version),
                            text, re.M | re.S)
          if not match:
              print("See CHANGELOG.md for the changes in %s." % os.environ["TAG"])
          else:
              print(match.group(0).strip())
          PY
          echo ""
          echo "### Artifacts"
          echo ""
          echo "These files are the ones CI built for this commit, uploaded to PyPI"
          echo "unchanged. The installer verifies the checksums before installing."
          echo ""
          echo '```bash'
          echo "curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh | sh"
          echo '```'
          echo ""
          echo "### Checksums"
          echo ""
          echo '```'
          cat dist/SHA256SUMS.txt
          echo '```'
          cat release-body.md

      - name: Show what would be published (dry run)
        if: ${{ github.event.inputs.dry_run == 'true' }}
        run: |
          echo "DRY RUN — no release created. Artefacts verified:"
          cat dist/SHA256SUMS.txt
          head -30 release-body.md

      - name: Publish the release
        if: ${{ github.event.inputs.dry_run != 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Silica ${{ github.event.inputs.tag || github.ref_name }}
          body_path: release-body.md
          draft: false
          prerelease: false
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS.txt
